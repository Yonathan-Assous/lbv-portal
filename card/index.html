<div class="page">
  <!-- The first screen: who we are in one line, and the choices -->
  <main id="home">
    <header class="top">
      <img class="top__logo" src="/media/logo-color.png" alt="La Belle Vie" width="96" height="92">
      <h1>נופש בחגים והפקת אירועים</h1>
      <p>15 שנות ניסיון, באווירה משפחתית.</p>
    </header>
    <h2 class="choose">במה אפשר לעזור לכם?</h2>
    <ul class="cards" id="cards"><!-- built by card.js --></ul>
    <footer class="foot">
      <ul class="foot__links">
        <li><a href="https://www.instagram.com/la_belle_vie_lbv/" target="_blank" rel="noopener">אינסטגרם</a></li>
        <li><a href="https://www.tiktok.com/@la.belle.vie.event" target="_blank" rel="noopener">טיקטוק</a></li>
        <li><a href="https://www.facebook.com/share/1JXfFgiY9Y/" target="_blank" rel="noopener">פייסבוק</a></li>
        <li><a href="https://youtube.com/@lbv-la_belle_vie" target="_blank" rel="noopener">יוטיוב</a></li>
        <li><a href="/">לאתר המלא</a></li>
      </ul>
      <button class="foot__share" id="share" type="button">שליחת הכרטיס לחבר</button>
      <p class="foot__copied" id="copied" role="status" hidden>הקישור הועתק</p>
      <figure class="foot__qr">
        <img src="/card/qr.png" alt="קוד QR לפתיחת הכרטיס בטלפון" width="108" height="108">
        <figcaption>לפתיחה בטלפון, סרקו את הקוד</figcaption>
      </figure>
    </footer>
  </main>

  <!-- One topic: its videos -->
  <section id="topic" hidden>
    <a class="back" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      חזרה לכל הנושאים
    </a>
    <h2 class="topic__name" id="topicName" tabindex="-1"></h2>
    <p class="topic__text" id="topicText"></p>
    <p class="topic__note" id="topicNote" hidden></p>
    <ul class="videos" id="videos"></ul>
    <a class="ask" id="topicAsk" target="_blank" rel="noopener">לשאול אותנו בוואטסאפ</a>
  </section>
</div>

<nav class="dock" aria-label="יצירת קשר">
